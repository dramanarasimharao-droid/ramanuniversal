eme';\n function set(day){h.classList.toggle('day',day);b.textContent=day?'Night mode':'Day mode';try{localStorage.setItem(k,day?'day':'night')}catch(e){}}\n var v=null;try{v=localStorage.getItem(k)}catch(e){}\n set(v==='day');\n b.addEventListener('click',function(){set(!h.classList.contains('day'))});\n})();\n\u003c/script>\n\u003c!-- DAYNIGHT-END -->\n\u003c/body>\n\u003c/html>\n", "about": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>About Raman Sir\u003c/title>\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003cbase target=\"_top\">\n\u003c/head>\n\u003cbody>\n\n\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\nhtml,body{background:#0A0907!important;margin:0}\nbody{margin:0;background:#0A0907;color:#F4EEDC;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}\na{color:inherit;text-decoration:none}\n.nav a:hover,.foot a:hover{color:#F3CF6E}\n.btn-gold{transition:background .2s}\n.btn-gold:hover{background:#F3CF6E}\n.btn-line{transition:border-color .2s,color .2s}\n.btn-line:hover{border-color:#F3CF6E;color:#F3CF6E}\na:focus-visible{outline:2px solid #F3CF6E;outline-offset:3px}\n@media (prefers-reduced-motion:reduce){*{transition:none!important}}\n\u003c/style>\n\n\u003cdiv id=\"top\" style=\"width:100%;background:#0A0907;color:#F4EEDC;font-family:'Inter',system-ui,sans-serif\">\n\n\u003c!-- NAV -->\n\n\n\u003c!-- INTRO -->\n\u003csection style=\"padding:72px 0 88px\">\n\u003cdiv style=\"max-width:1200px;margin:0 auto;padding:0 24px;box-sizing:border-box;display:flex;flex-wrap:wrap;align-items:center;gap:56px\">\n\u003cdiv style=\"flex:1 1 460px;min-width:0\">\n\u003cp style=\"font:6 px;line-height:1.75;color:#D9D0B8\">\u003cstrong style=\"color:#F4EEDC\">Who we are.\u003c/strong> Raman Universal (ramanuniversal.com) is run by Raman Universal English Hub in Andhra Pradesh, India. We sell digital educational materials such as lesson PPTs, grammar decks, worksheets, question papers and PDFs for English, Class VI to X.\u003c/p>\n\u003cp style=\"margin:0;font-size:16px;line-height:1.75;color:#D9D0B8\">\u003cstrong style=\"color:#F4EEDC\">Using this website.\u003c/strong> By using this website or buying from it, you agree to these terms. If you are under 18, please buy with the help of a parent or guardian.\u003c/p>\n\u003cp style=\"margin:0;font-size:16px;line-height:1.75;color:#D9D0B8\">\u003cstrong style=\"color:#F4EEDC\">Products and prices.\u003c/strong> All prices are in Indian Rupees (INR). We may change prices or products at any time. The price shown when you pay is the price you are charged. We describe each product as clearly as we can, including what is inside and the file format.\u003c/p>\n\u003cp style=\"margin:0;font-size:16px;line-height:1.75;color:#D9D0B8\">\u003cstrong style=\"color:#F4EEDC\">Payments.\u003c/strong> Payments are processed by Razorpay. We do not see or store your card, UPI or bank details.\u003c/p>\n\u003cp style=\"margin:0;font-size:16px;line-height:1.75;color:#D9D0B8\">\u003cstrong style=\"color:#F4EEDC\">Delivery.\u003c/strong> All products are digital. After a successful payment, the files are sent to the email address you give at checkout. Please check that the address is correct, and look in your spam folder if you do not see our email.\u003c/p>\n\u003cp style=\"margin:0;font-size:16px;line-height:1.75;color:#D9D0B8\">\u003cstrong style=\"color:#F4EEDC\">Ownership.\u003c/strong> All materials, designs, logos and videos on this website belong to Raman Universal. Buying a file gives you a licence to use it, not ownership of it. See Licence and Usage below.\u003c/p>\n\u003cp style=\"margin:0;font-size:16px;line-height:1.75;color:#D9D0B8\">\u003cstrong style=\"color:#F4EEDC\">Study aid only.\u003c/strong> Our materials help students learn and teachers teach. We do not promise any particular marks, grades or exam result.\u003c/p>\n\u003cp style=\"margin:0;font-size:16px;line-height:1.75;color:#D9D0B8\">\u003cstrong style=\"color:#F4EEDC\">Limit of liability.\u003c/strong> To the extent the law allows, our liability for any claim about a product is limited to the amount you paid for that product.\u003c/p>\n\u003cp style=\"margin:0;font-size:16px;line-height:1.75;color:#D9D0B8\">\u003cstrong style=\"color:#F4EEDC\">Changes.\u003c/strong> We may update these terms from time to time. The date at the top of this page shows the latest update.\u003c/p>\n\u003cp style=\"margin:0;font-size:16px;line-height:1.75;color:#D9D0B8\">\u003cstrong style=\"color:#F4EEDC\">Governing law.\u003c/strong> These terms follow the laws of India. Any dispute falls under the courts at Vijayawada, Andhra Pradesh.\u003c/p>\n\u003c/div>\n\u003c/section>\n\n\u003c!-- PRIVACY -->\n\u003csection id=\"privacy\" style=\"padding:56px 0;border-top:1px solid rgba(227,178,60,.14)\">\n\u003cdiv style=\"max-width:800px;margin:0 auto;padding:0 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px\">\n\u003ch2 style=\"font:600 clamp(28px,3.4vw,38px)/1.12 'Space Grotesk',sans-serif;margin:0 0 6px;color:#E3B23C\">Privacy Policy\u003c/h2>\n\u003cp style=\"margin:0;font-size:16px;line-height:1.75;color:#D9D0B8\">\u003cstrong style=\"color:#F4EEDC\">What we collect.\u003c/strong> When you buy or contact us, we collect your name, email address and, if you give it, your phone number. Razorpay shares the payment status and a payment reference with us. We never receive your card number, UPI PIN or bank password.\u003c/p>\n\u003cp style=\"margin:0;font-size:16px;line-height:1.75;color:#D9D0B8\">\u003cstrong style=\"color:#F4EEDC\">Why we collect it.\u003c/strong> We use your details to send the files you bought, confirm your payment, answer your questions and handle refund requests. We send news about new materials only if you agree to receive it.\u003c/p>\n\u003cp style=\"margin:0;font-size:16px;line-height:1.75;color:#D9D0B8\">\u003cstrong style=\"color:#F4EEDC\">Who sees it.\u003c/strong> We do not sell or rent your details. They are handled only by the services that run the shop: Razorpay for payments, Google for the website and email, and Payhip where a product is delivered through it. Each follows its own privacy rules.\u003c/p>\n\u003cp style=\"margin:0;font-size:16px;line-height:1.75;color:#D9D0B8\">\u003cstrong style=\"color:#F4EEDC\">How long we keep it.\u003c/strong> We keep order records for as long as needed for support, refunds and our accounts, and then delete them.\u003c/p>\n\u003cp style=\"margin:0;font-size:16px;line-height:1.75;color:#D9D0B8\">\u003cstrong style=\"color:#F4EEDC\">Your choices.\u003c/strong> You may ask us to show, correct or delete the personal details we hold about you, or to stop sending you updates. Write to us at the email below. This follows the Digital Personal Data Protection Act, 2023.\u003c/p>\n\u003cp style=\"margin:0;font-size:16px;line-height:1.75;color:#D9D0B8\">\u003cstrong style=\"color:#F4EEDC\">Children.\u003c/strong> Students under 18 should buy with a parent or guardian, who then gives us the contact details.\u003c/p>\n\u003cp style=\"margin:0;font-size:16px;line-height:1.75;color:#D9D0B8\">\u003cstrong style=\"color:#F4EEDC\">Cookies.\u003c/strong> This website is built on Google Sites, which may use cookies and basic analytics to keep the site working.\u003c/p>\n\u003c/div>\n\u003c/section>\n\n\u003c!-- REFUND -->\n\u003csection id=\"refund\" style=\"padding:56px 0;border-top:1px solid rgba(227,178,60,.14)\">\n\u003cdiv style=\"max-width:800px;margin:0 auto;padding:0 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px\">\n\u003ch2 style=\"font:600 clamp(28px,3.4vw,38px)/1.12 'Space Grotesk',sans-seri  dn.addEventListener('click',function(){day=!day;try{localStorage.setItem('ru-theme',day?'day':'night')}catch(e){}theme()});
 bur.addEventListener('click',function(){var o=side.classList.toggle('open');bur.setAttribute('aria-expanded',o?'true':'false');syncBody()});
 window.addEventListener('resize',syncBody);
 function go(k){
  if(!PAGES[k])k='home';cur=k;
  document.querySelectorAll('.grp a').forEach(function(a){var on=a.getAttribute('data-go')===k;a.classList.toggle('on',on);if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  fr.srcdoc=PAGES[k];
  if(mobile()){side.classList.remove('open');bur.setAttribute('aria-expanded','false')}
  syncBody();
  try{history.replaceState(null,'','#'+k)}catch(e){}
 }
 fr.addEventListener('load',function(){
  var d;try{d=fr.contentDocument}catch(e){return}
  if(!d||!d.body)return;
  applyTheme();
  d.addEventListener('click',function(e){
   var a=e.target.closest&&e.target.closest('a');if(!a)return;
   var h=a.getAttribute('href')||'';
   if(h.charAt(0)==='#'){e.preventDefault();var id=h.slice(1),t=id?d.getElementById(id):d.body;if(t)t.scrollIntoView({behavior:'smooth'});return}
   var m=h.match(/^https?:\/\/(?:www\.)?ramanuniversal\.com\/([a-z-]+)\/?(?:#.*)?$/);
   if(m&&PAGES[m[1]]){e.preventDefault();go(m[1])}
  });
  d.querySelectorAll('a[href^="http"]').forEach(function(a){if(!/ramanuniversal\.com\/([a-z-]+)\/?$/.test(a.href)||!PAGES[RegExp.$1]){a.target='_blank';a.rel='noopener'}});
 });
 function filter(){
  var t=q.value.trim().toLowerCase(),n=0;
  side.querySelectorAll('.grp').forEach(function(g){var any=0;g.querySelectorAll('li').forEach(function(li){var ok=!t||li.getAttribute('data-k').indexOf(t)>-1;li.hidden=!ok;if(ok)any++});g.hidden=!any;n+=any});
  none.hidden=n>0;
 }
 q.addEventListener('input',filter);
 q.addEventListener('keydown',function(e){if(e.key==='Enter'){var a=side.querySelector('.grp:not([hidden]) li:not([hidden]) a');if(a){go(a.getAttribute('data-go'));q.value='';filter()}}});
 side.addEventListener('click',function(e){var a=e.target.closest('[data-go]');if(a){e.preventDefault();go(a.getAttribute('data-go'))}});
 var start='home';try{var h=location.hash.slice(1);if(PAGES[h])start=h}catch(e){}
 theme();syncBody();go(start);

 /* keep the sidebar inside the part of the embed that is on screen (works even when Google Sites scrolls the whole embed) */
 (function(){
  var rail=document.getElementById('rail'),sent=document.getElementById('sent'),io=null,vis={},step=16,H=0,tmr=null;
  if(!('IntersectionObserver' in window))return;
  function apply(){
   if(mobile()){rail.style.removeProperty('--pt');rail.style.removeProperty('--ph');return}
   var lo=1e9,hi=-1;for(var k in vis){if(vis[k]){k=+k;if(k<lo)lo=k;if(k>hi)hi=k}}
   if(hi<0)return;
   var top=lo*step,bot=Math.min(H,(hi+1)*step),m=16,h=Math.max(300,bot-top-2*m),t=top+m;
   if(t+h>H-m){t=Math.max(m,H-m-h);h=Math.min(h,H-2*m)}
   rail.style.setProperty('--pt',t+'px');rail.style.setProperty('--ph',h+'px');
  }
  function build(){
   if(io)io.disconnect();vis={};sent.innerHTML='';
   H=document.documentElement.clientHeight;if(!H)return;
   step=Math.max(16,Math.ceil(H/900));var n=Math.ceil(H/step),f=document.createDocumentFragment();
   io=new IntersectionObserver(function(es){es.forEach(function(e){vis[e.target.getAttribute('data-i')]=e.isIntersecting});apply()},{threshold:0});
   for(var i=0;i<n;i++){var d=document.createElement('div');d.setAttribute('data-i',i);d.style.cssText='height:'+step+'px;width:1px';f.appendChild(d)}
   sent.appendChild(f);sent.style.visibility='visible';
   sent.querySelectorAll('div').forEach(function(d){io.observe(d)});
  }
  build();
  window.addEventListener('resize',function(){clearTimeout(tmr);tmr=setTimeout(build,200)});
 })();
})();
</script>
</body></html>
